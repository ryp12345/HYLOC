name: Deploy Application

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Stop at the first failing command so a failed pull or build
            # does not still report "Deployment Successful"
            set -e

            if [ "${{ github.ref_name }}" = "main" ]; then
              APP_DIR="/var/www/hyloc"
              PM2_NAME="hyloc-server"
              echo "🚀 Deploying to PRODUCTION"
            else
              APP_DIR="/var/www/hyloc-staging"
              PM2_NAME="hyloc-staging"
              echo "🧪 Deploying to STAGING"
            fi

            cd $APP_DIR

            echo "📥 Pulling latest code"
            git pull origin ${{ github.ref_name }}
            echo "Now on commit: $(git log -1 --oneline)"

            echo "📦 Installing server dependencies"
            cd server
            npm install

            echo "🔄 Restarting server"
            pm2 reload $PM2_NAME || pm2 start server.js --name $PM2_NAME

            echo "🏗 Building frontend"
            cd ../client
            npm install
            npm run build

            echo "♻ Reloading Nginx"
            sudo systemctl reload nginx

            echo "✅ Deployment Successful"